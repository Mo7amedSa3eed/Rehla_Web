<nav class="navbar" *ngIf="showShellChrome">
  <div class="container nav-content">

    <div class="logo">
      <div class="logo-icon">🚉</div>
      <span>Rihla</span>
    </div>

    <div class="nav-links">
      <a routerLink="/home">Home</a>
      <a routerLink="/about">About</a>
    </div>

    <div class="profile-icon">
      <div class="avatar" routerLink="/profile" style="cursor:pointer">

      <img *ngIf="state.userProfile.photo; else defaultIcon"
          [src]="state.userProfile.photo"
          class="nav-avatar-img"/>

          <ng-template #defaultIcon>
            👤
          </ng-template>

      </div>
    </div>

  </div>
</nav>


<div class="container" *ngIf="showShellChrome">
  <div class="sub-nav">
    <button class="btn" routerLink="/booking" routerLinkActive="active-nav">
      🎫 Book Trip
    </button>
    <button class="btn" routerLink="/trips" routerLinkActive="active-nav">
      🚌 Available Trips
    </button>
    <button class="btn" routerLink="/my-bookings" routerLinkActive="active-nav">
      📋 My Bookings
    </button>
    <button class="btn" routerLink="/my-tickets" routerLinkActive="active-nav">
      🎟 My Tickets
    </button>
    <button class="btn" routerLink="/challenges" routerLinkActive="active-nav">
      ⭐ Rewards
    </button>
  </div>
</div>
