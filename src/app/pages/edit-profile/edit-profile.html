<div class="page-wrapper">

  <div class="profile-card">


    <div class="avatar-section">
      <div class="avatar-wrapper">
        <img *ngIf="user.photo; else defaultIcon"
             [src]="user.photo"
             class="avatar-img" />

        <ng-template #defaultIcon>
          <div class="avatar-default">👤</div>
        </ng-template>
      </div>

      <label class="change-photo-btn btn btn-outline">
        Change Photo
        <input type="file" hidden (change)="onPhotoSelected($event)" />
      </label>
    </div>


    <form class="form-grid" #profileForm="ngForm" (ngSubmit)="saveChanges(profileForm)">

      <div class="form-group">
        <label>First Name</label>
        <input
          name="firstName"
          required
          minlength="2"
          maxlength="50"
          [(ngModel)]="user.firstName"
          placeholder="First Name" />
        <span
          class="error"
          *ngIf="profileForm.controls['firstName']?.invalid && (profileForm.controls['firstName']?.touched || profileForm.submitted)">
          <span *ngIf="profileForm.controls['firstName']?.errors?.['required']">First name is required.</span>
          <span *ngIf="profileForm.controls['firstName']?.errors?.['minlength']">Minimum 2 characters.</span>
        </span>
      </div>

      <div class="form-group">
        <label>Family Name</label>
        <input
          name="familyName"
          minlength="2"
          maxlength="50"
          [(ngModel)]="user.familyName"
          placeholder="Family Name" />
        <span
          class="error"
          *ngIf="profileForm.controls['familyName']?.invalid && (profileForm.controls['familyName']?.touched || profileForm.submitted)">
          <span *ngIf="profileForm.controls['familyName']?.errors?.['minlength']">Minimum 2 characters.</span>
        </span>
      </div>

      <div class="form-group">
        <label>Last Name</label>
        <input
          name="lastName"
          required
          minlength="2"
          maxlength="50"
          [(ngModel)]="user.lastName"
          placeholder="Last Name" />
        <span
          class="error"
          *ngIf="profileForm.controls['lastName']?.invalid && (profileForm.controls['lastName']?.touched || profileForm.submitted)">
          <span *ngIf="profileForm.controls['lastName']?.errors?.['required']">Last name is required.</span>
          <span *ngIf="profileForm.controls['lastName']?.errors?.['minlength']">Minimum 2 characters.</span>
        </span>
      </div>

      <div class="form-group">
        <label>Email Address</label>
        <input
          name="email"
          type="email"
          maxlength="255"
          [(ngModel)]="user.email"
          placeholder="Email Address" />
        <span
          class="error"
          *ngIf="profileForm.controls['email']?.invalid && (profileForm.controls['email']?.touched || profileForm.submitted)">
          <span *ngIf="profileForm.controls['email']?.errors?.['email']">Enter a valid email address.</span>
        </span>
      </div>

      <div class="form-group">
        <label>Phone Number</label>
        <input
          name="phoneNumber"
          pattern="^\+?[1-9]\d{7,14}$"
          minlength="8"
          maxlength="15"
          [(ngModel)]="user.phoneNumber"
          placeholder="+201234567890" />
        <span
          class="error"
          *ngIf="profileForm.controls['phoneNumber']?.invalid && (profileForm.controls['phoneNumber']?.touched || profileForm.submitted)">
          <span *ngIf="profileForm.controls['phoneNumber']?.errors?.['pattern']">Enter a valid phone number (E.164).</span>
          <span *ngIf="profileForm.controls['phoneNumber']?.errors?.['minlength']">Minimum 8 digits.</span>
        </span>
      </div>

      <div class="button-row">
        <button
          class="save-btn btn btn-primary"
          type="submit"
          [disabled]="profileForm.invalid">
          Save Changes
        </button>
        <button class="cancel-btn btn btn-outline" type="button" (click)="cancel()">Cancel</button>
      </div>
    </form>

  </div>
</div>
