<div class="auth-container">
  <div class="page-language-switch">
    <app-language-switch></app-language-switch>
  </div>

  <div class="animated-background">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <div class="auth-card">
    <div class="auth-header">
      <div class="badge-glass">
        <span class="pulse-dot"></span> {{ 'Welcome back' | t }}
      </div>
      <h1 class="auth-title">{{ 'Sign in to Rihla' | t }}</h1>
      <p class="auth-subtitle">{{ 'Access your bookings, tickets, and wallet.' | t }}</p>
    </div>

    <form #loginForm="ngForm" (ngSubmit)="submit(loginForm)">
      <div class="form-stack">
        <div class="form-group glass-input-group">
          <label>{{ 'Email Address' | t }}</label>
          <input
            name="email"
            type="email"
            required
            maxlength="255"
            [(ngModel)]="credentials.email"
            placeholder="you@example.com" />
        </div>

        <div class="form-group glass-input-group">
          <label>{{ 'Password' | t }}</label>
          <input
            name="password"
            type="password"
            required
            [(ngModel)]="credentials.password"
            placeholder="••••••••" />
        </div>
      </div>

      <div class="form-actions">
        <div class="error-msg" *ngIf="errorMessage">{{ errorMessage }}</div>
        
        <div class="helper-row">
          <a class="link-glow" routerLink="/auth/forgot-password">{{ 'Forgot password?' | t }}</a>
        </div>

        <button
          class="btn-glow full-width"
          type="submit"
          [disabled]="loginForm.invalid || isSubmitting">
          <span>{{ isSubmitting ? ('Signing in...' | t) : ('Sign In' | t) }}</span>
          <span class="arrow">→</span>
        </button>
        
        <div class="helper-text-center">
          {{ 'New here?' | t }} <a class="link-glow" routerLink="/signup">{{ 'Create an account' | t }}</a>
        </div>
      </div>
    </form>
  </div>
</div>
