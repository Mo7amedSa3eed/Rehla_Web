<div class="auth-container">
  <div class="animated-background">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <div class="auth-card">
    <div class="auth-header">
      <div class="badge-glass">
        <span class="pulse-dot"></span> Welcome back
      </div>
      <h1 class="auth-title">Sign in to Rihla</h1>
      <p class="auth-subtitle">Access your bookings, tickets, and wallet.</p>
    </div>

    <form #loginForm="ngForm" (ngSubmit)="submit(loginForm)">
      <div class="form-stack">
        <div class="form-group glass-input-group">
          <label>Email Address</label>
          <input
            name="email"
            type="email"
            required
            maxlength="255"
            [(ngModel)]="credentials.email"
            placeholder="you@example.com" />
        </div>

        <div class="form-group glass-input-group">
          <label>Password</label>
          <input
            name="password"
            type="password"
            required
            minlength="8"
            [(ngModel)]="credentials.password"
            placeholder="Password123" />
        </div>
      </div>

      <div class="form-actions">
        <div class="error-msg" *ngIf="errorMessage">{{ errorMessage }}</div>
        
        <div class="helper-row">
          <a class="link-glow" routerLink="/auth/forgot-password">Forgot password?</a>
        </div>

        <button
          class="btn-glow full-width"
          type="submit"
          [disabled]="loginForm.invalid || isSubmitting">
          <span>{{ isSubmitting ? 'Signing in...' : 'Sign In' }}</span>
          <span class="arrow">→</span>
        </button>
        
        <div class="helper-text-center">
          New here? <a class="link-glow" routerLink="/signup">Create an account</a>
        </div>
      </div>
    </form>
  </div>
</div>
