<div class="login-page">
  <div class="login-card card">
    <div class="login-header">
      <div class="login-badge">Welcome back</div>
      <h1>Sign in to Rihla</h1>
      <p>Access your bookings, tickets, and wallet.</p>
    </div>

    <form #loginForm="ngForm" (ngSubmit)="submit(loginForm)">
      <div class="form-stack">
        <div class="form-group">
          <label>Email Address</label>
          <input
            name="email"
            type="email"
            required
            maxlength="255"
            [(ngModel)]="credentials.email"
            placeholder="you@example.com" />
        </div>

        <div class="form-group">
          <label>Password</label>
          <input
            name="password"
            type="password"
            required
            minlength="8"
            [(ngModel)]="credentials.password"
            placeholder="Password123" />
        </div>
      </div>

      <div class="form-actions">
        <div class="error" *ngIf="errorMessage">{{ errorMessage }}</div>
        <div class="helper-text helper-text-right">
          <a routerLink="/auth/forgot-password">Forgot password?</a>
        </div>
        <button
          class="btn btn-primary"
          type="submit"
          [disabled]="loginForm.invalid || isSubmitting">
          {{ isSubmitting ? 'Signing in...' : 'Sign In' }}
        </button>
        <div class="helper-text">
          New here? <a routerLink="/signup">Create an account</a>
        </div>
      </div>
    </form>
  </div>
</div>
