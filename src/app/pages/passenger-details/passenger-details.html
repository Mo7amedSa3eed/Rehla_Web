<div class="passenger-page">
  <div class="header">
    <button class="back-btn" type="button" (click)="goBack()" [disabled]="isProcessing">
      ←
    </button>
    <h1>Passenger Details</h1>
  </div>

  <ng-container *ngIf="selectedTrip && form">
    <form [formGroup]="form">
      <div formArrayName="passengers">
        <div *ngFor="let control of passengersArray.controls; let i = index">
          
          <app-passenger-card
            [group]="$any(control)"
            [index]="i"
            [isTrain]="isTrain"
            [showEmail]="true"
            [requirePhone]="true"
            [phoneCodes]="phoneCodes">
          </app-passenger-card>

          <!-- Autofill Banner immediately after first passenger if bus and multi-pax -->
          <app-passenger-autofill-banner
            *ngIf="i === 0 && showAutofillBanner"
            [isAutofilled]="isAutofilled"
            [errorMessage]="autofillError"
            (triggerAutofill)="handleAutofill()">
          </app-passenger-autofill-banner>

        </div>
      </div>
    </form>
  </ng-container>

  <div class="loyalty-section">
    <div class="loyalty-header">
      <span class="loyalty-icon">💎</span>
      <h3>Use Loyalty Points</h3>
    </div>
    <input
      class="loyalty-slider"
      type="range"
      [min]="0"
      [max]="maxRedeemablePoints"
      [step]="pointsPerEgp"
      [value]="pointsToRedeem"
      (input)="onPointsChange($event)" />

    <div class="loyalty-card">
      <div class="loyalty-row">
        <span>Points used</span>
        <span>{{ pointsToRedeem }} pts</span>
      </div>
      <div class="loyalty-row">
        <span>Discount</span>
        <span class="discount">- {{ discountValue | number:'1.2-2' }} EGP</span>
      </div>
      <div class="loyalty-row">
        <span>Remaining after</span>
        <span class="remaining">{{ pointsBalance - pointsToRedeem }} pts</span>
      </div>
      <div class="divider"></div>
      <div class="loyalty-row total">
        <span>Final total</span>
        <span>{{ finalTotal | number:'1.2-2' }} EGP</span>
      </div>
    </div>
    <div class="loyalty-hint">{{ pointsPerEgp }} pts = 1.00 EGP</div>
  </div>

  <div class="action-buttons">
    <button
      class="btn add-to-cart-btn"
      type="button"
      [disabled]="form.invalid || isProcessing"
      (click)="addToCart()">
      {{ isProcessing ? 'Processing...' : 'Add to Cart' }}
    </button>
    <button
      class="btn book-now-btn"
      type="button"
      [disabled]="form.invalid || isProcessing"
      (click)="bookNow()">
      {{ isProcessing ? 'Processing...' : 'Book Now' }}
    </button>
  </div>
</div>
