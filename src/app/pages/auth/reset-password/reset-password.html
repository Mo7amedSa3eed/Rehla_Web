<div class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-badge">Secure access</div>
      <h1>Reset your password</h1>
      <p>Create a new password for your Rihla account.</p>
    </div>

    <div *ngIf="successMessage" class="feedback success">{{ successMessage }}</div>
    <div *ngIf="errorMessage" class="feedback error">{{ errorMessage }}</div>

    <form #f="ngForm" (ngSubmit)="submit(f)">
      <div class="field-group">
        <label for="newPassword">New Password</label>
        <input
          id="newPassword"
          name="newPassword"
          [(ngModel)]="newPassword"
          type="password"
          required
          minlength="8"
          pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).+$"
          placeholder="Enter a strong password" />
        <small>Use at least 8 characters with uppercase, lowercase, and a number.</small>
      </div>

      <div class="field-group">
        <label for="confirmPassword">Confirm Password</label>
        <input
          id="confirmPassword"
          name="confirmPassword"
          [(ngModel)]="confirmPassword"
          type="password"
          required
          minlength="8"
          placeholder="Repeat your password" />
      </div>

      <button class="primary-btn" type="submit" [disabled]="isSubmitting || f.invalid">
        {{ isSubmitting ? 'Saving...' : 'Reset Password' }}
      </button>
    </form>

    <a class="back-link" routerLink="/login">Back to login</a>
  </div>
</div>
