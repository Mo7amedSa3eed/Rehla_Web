<div class="auth-page">
  <div class="auth-card card">
    <div class="auth-header">
      <div class="auth-badge">Password recovery</div>
      <h1>Forgot your password?</h1>
      <p>Enter your email and we will send a reset link if your account exists.</p>
    </div>

    <div *ngIf="successMessage" class="feedback success">{{ successMessage }}</div>
    <div *ngIf="errorMessage" class="feedback error">{{ errorMessage }}</div>

    <form #forgotForm="ngForm" (ngSubmit)="submit(forgotForm)">
      <div class="field-group">
        <label for="email">Email Address</label>
        <input
          id="email"
          name="email"
          type="email"
          required
          maxlength="255"
          [(ngModel)]="email"
          placeholder="you@example.com" />
      </div>

      <button class="btn btn-primary auth-submit" type="submit" [disabled]="isSubmitting || forgotForm.invalid">
        {{ isSubmitting ? 'Sending...' : 'Send Reset Link' }}
      </button>
    </form>

    <a class="back-link" routerLink="/login">Back to login</a>
  </div>
</div>
